<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" fill="none">
  <defs>
    <path id="star" d="M 63 85 L 137 119 Q 145 122 152 114 L 214 39 Q 223 28 225 47 L 230 126 Q 231 136 243 133 L 337 112 Q 351 109 340 123 L 279 187 Q 271 196 277 207 L 326 292 Q 333 306 319 299 L 242 259 Q 230 253 225 265 L 202 323 Q 197 336 191 322 L 164 266 Q 159 257 149 266 L 86 326 Q 73 337 76 319 L 85 247 Q 86 235 73 232 L 22 219 Q 8 216 21 206 L 84 165 Q 94 158 87 149 L 53 99 Q 44 79 63 85 Z"/>
    <filter id="crayon" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.085" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="grain">
      <rect width="400" height="360" fill="white"/>
      <filter id="speckles" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="12" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="discrete" tableValues="0 0 0 0 1"/></feComponentTransfer>
      </filter>
    </mask>
  </defs>
  <!-- Transparent background; original star outline preserved -->
  <g filter="url(#crayon)" stroke-linejoin="round" stroke-linecap="round">
    <use href="#star" stroke="#F3A0A7" stroke-width="12" opacity="0.42"/>
    <use href="#star" stroke="#E66D7C" stroke-width="8.4" opacity="0.84"/>
    <use href="#star" stroke="#D95865" stroke-width="4.4" opacity="0.65" stroke-dasharray="1.8 0.8 3.5 0.4"/>
    <use href="#star" stroke="#F7B1B7" stroke-width="1.7" opacity="0.68" stroke-dasharray="3 2 0.6 1.4" transform="translate(-1.2 1.1)"/>
  </g>
</svg>
